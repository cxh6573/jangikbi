name: daily-monitor
on:
  schedule:
    - cron: "17 21 * * *"   # 06:17 KST (1차)
    - cron: "4 22 * * *"    # 07:04 KST (예비: 1차가 GitHub 사정으로 건너뛰어진 날 대비)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-monitor     # 두 실행이 겹치지 않게 순서대로
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          POST_TITLES: "0"   # 영어 제목 게시 끔 → 한글 게시는 Claude 예약 작업이 담당
        run: python monitor.py
      - name: Save data
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git pull --rebase --quiet || true
          git push
